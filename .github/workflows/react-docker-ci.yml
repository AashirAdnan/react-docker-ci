name: react-docker-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  GHCR:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{github.event_name == 'push'}}
          file: Dockerfile
          tags: ghcr.io/aashiradnan/react-docker-ci:latest
