name: react-docker-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  GHCR:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{github.event_name == 'push'}}
          file: Dockerfile
          tags: ghcr.io/aashiradnan/react-docker-ci:latest
  Deploy:
    runs-on: self-hosted
    needs: GHCR
    if: ${{github.event_name == 'push'}}
    steps:
      - name: login to ghcr
        run: echo "${{secrets.GITHUB_TOKEN}}" | docker login ghcr.io -u ${{github.actor}} --password-stdin

      - name: pull the docker image
        run: docker pull ghcr.io/aashiradnan/react-docker-ci:latest

      - name: remove old container
        run: docker container rm -f react-docker-ci-selfhosted || true

      - name: make a new container
        run: docker run -d --name react-docker-ci-selfhosted -p 3000:80 ghcr.io/aashiradnan/react-docker-ci:latest
